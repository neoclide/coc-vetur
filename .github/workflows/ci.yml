name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use npm 11.9.0
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
